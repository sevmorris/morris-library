<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seven’s Library: A Selection</title>
<meta name="description" content="A personal book catalog.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e6edf3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101a24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101a24'/%3E%3Cpath fill='%23f4a259' d='M8 7h4v18H8zM14 7h4v18h-4zM20.2 7.6l3.8-1 4 17.4-3.8 1z' transform='translate(-1)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: one reading column of two-line catalog rows. The search bar and each group head stay pinned, because the list runs to many screens. */
:root{
  color-scheme:light;
  --bg:#e6edf3; --surface:#f5f9fc; --fg:#2a1e17; --muted:#5a4e46; --rule:#c6d2dc;
  --accent:#ad3a10; --gold:#855600;
  --bar:0px;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101a24; --surface:#1a2733; --fg:#f4ead8; --muted:#c2b5a3; --rule:#2d3d4b;
  --accent:#f4a259; --gold:#f2cc6b; color-scheme:dark}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
::selection{background:var(--accent);color:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-bottom:64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{display:grid;gap:6px;padding-top:max(28px,env(safe-area-inset-top,0px));padding-bottom:16px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,10vw,72px);line-height:.92;margin:0;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
h1 span{display:block;font-weight:500;font-size:.42em;line-height:1.2;letter-spacing:.06em;color:var(--accent)}
.tally{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tally b{color:var(--fg);font-weight:600}

.bar{position:sticky;top:0;z-index:2;display:grid;gap:8px;padding-block:10px;background:var(--bg);border-bottom:1px solid var(--rule)}
.search{width:100%;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--fg)}
.search::placeholder{color:var(--muted);opacity:1}
.search:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:2px;align-items:center}
.seg>span{color:var(--muted);margin-right:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.seg button{font:500 14px var(--f-body);min-height:36px;background:none;border:0;padding:4px 12px;border-radius:5px;color:var(--muted);cursor:pointer}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
@media (max-width:520px){
  .seg>span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .seg button{flex:1 1 auto;min-height:40px;padding-inline:4px}
}

.group{margin-top:14px}
.ghead{position:sticky;top:var(--bar);z-index:1;display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--bg);border-bottom:2px solid var(--accent);padding-block:8px 3px}
.ghead h2{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.15;margin:0;text-transform:uppercase;letter-spacing:.03em}
.ghead h2.plain{text-transform:none}
.ghead h2.author{font-weight:700;font-size:26px;line-height:1.1}
.count{font-family:var(--f-mono);font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted)}

.set{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:14px 0 0;padding-bottom:3px;border-bottom:1px solid var(--rule);font:600 16px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}

.row{display:grid;grid-template-columns:88px 1fr auto;grid-template-rows:auto auto 1fr;gap:0 14px;padding:10px 0 11px;border-bottom:1px solid var(--rule)}
.cover{grid-row:1/4;display:block;width:88px;height:132px;object-fit:cover;border-radius:3px;background:var(--surface);box-shadow:0 0 0 1px var(--rule)}
.row h3{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.15;margin:0;min-width:0}
.row .yr{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.row .m{grid-column:2/-1;font-size:13.5px;color:var(--muted);margin-top:1px}
.row .m>span:not(:last-child)::after{content:" · ";color:var(--muted);font-weight:400}
.more{grid-column:2/-1;margin-top:3px;font-size:14px}
.more summary{cursor:pointer;width:fit-content;padding-block:4px;font-weight:600;font-size:13.5px;color:var(--accent)}
.more summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more p{margin:0 0 4px;max-width:62ch}
@media (max-width:520px){
  .row{grid-template-columns:72px 1fr auto;gap:0 12px}
  .cover{width:72px;height:108px}
}
.step{color:var(--accent)}
.by{color:var(--fg);font-weight:600;font-size:15px}
.series{color:var(--accent);font-weight:500}
.award{color:var(--gold);font-weight:600}

footer{margin-top:28px;font-size:13px;color:var(--muted)}
footer a{color:inherit}

.state{padding:40px 8px;text-align:center;color:var(--muted)}
.state strong{display:block;font-family:var(--f-display);font-size:24px;color:var(--fg);text-transform:uppercase;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Seven’s Library <span>A Selection</span></h1>
    <div class="tally" id="tally" role="status">Loading the catalog…</div>
  </header>

  <div class="bar" id="bar">
    <input id="q" class="search" type="search" placeholder="Search title, author, series, ISBN" aria-label="Search the catalog">
    <div class="seg" role="group" aria-label="Group by">
      <span>Group by</span>
      <button type="button" data-k="author" aria-pressed="true">Author</button>
      <button type="button" data-k="title" aria-pressed="false">Title</button>
      <button type="button" data-k="publisher" aria-pressed="false">Publisher</button>
      <button type="button" data-k="decade" aria-pressed="false">Decade</button>
    </div>
  </div>

  <main id="list">
    <div class="state"><strong>Fetching the catalog</strong>Books appear here as soon as the record loads.</div>
  </main>

  <footer>Most cover images are from <a href="https://openlibrary.org/">Open Library</a>, and some show a different edition from the copy on the shelf. Covers remain the property of their copyright holders.</footer>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  let books = [], groupKey = "author", query = "";

  try { const g = localStorage.getItem("ml-group"); if (g && document.querySelector(`.seg button[data-k="${g}"]`)) groupKey = g; } catch(e) {}
  syncSeg();

  const setBar = () => document.documentElement.style.setProperty("--bar", $("#bar").offsetHeight+"px");
  new ResizeObserver(setBar).observe($("#bar"));
  setBar();

  function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function sortAuthor(b){ if (b.authorSort) return b.authorSort; const p = String(b.author||"").trim().split(/\s+/); return p.length>1 ? p[p.length-1]+", "+p.slice(0,-1).join(" ") : (b.author||""); }
  function authorHead(b){ return [sortAuthor(b), ...String(b.author||"").split(" & ").slice(1)].join(" & "); }
  function sortTitle(t){ return String(t||"").replace(/^(the|a|an)\s+/i,""); }
  function decade(y){ const n = parseInt(y,10); return isNaN(n) ? "Undated" : (Math.floor(n/10)*10)+"s"; }
  function plural(n,word){ return `${n} ${word}${n===1?"":"s"}`; }
  const isSecondCopy = b => /second copy/i.test(b.notes||"");

  // The set a book sits under in Author view. A series with only one title owned isn't worth a heading of its own.
  function setOf(b){
    if (b.readingGroup) return b.readingGroup;
    if (!b.series) return "";
    return new Set(books.filter(x => x.author===b.author && x.series===b.series).map(x => x.title)).size>1 ? b.series : "";
  }

  function groupOf(b){
    switch(groupKey){
      case "author": return authorHead(b) || "?";
      case "title": return sortTitle(b.title).charAt(0).toUpperCase() || "?";
      case "publisher": return b.publisher || "Unknown publisher";
      case "decade": return decade(b.year);
    }
  }
  function cmp(a,b){
    const sa = sortAuthor(a).toLowerCase(), sb = sortAuthor(b).toLowerCase();
    const bySeries = (a.series||"")===(b.series||"") && a.series ? (Number(a.seriesNo)||0)-(Number(b.seriesNo)||0) : 0;
    if (groupKey==="title") return sortTitle(a.title).localeCompare(sortTitle(b.title));
    if (groupKey==="decade") return (Number(a.year)||9999)-(Number(b.year)||9999) || sa.localeCompare(sb);
    if (groupKey==="author"){
      const setA = setOf(a), setB = setOf(b);
      return sa.localeCompare(sb) || (!setA)-(!setB) || sortTitle(setA).localeCompare(sortTitle(setB))
        || (Number(a.readingOrder)||9999)-(Number(b.readingOrder)||9999)
        || sortTitle(a.title).localeCompare(sortTitle(b.title)) || isSecondCopy(a)-isSecondCopy(b);
    }
    return sa.localeCompare(sb) || (a.series||"~").localeCompare(b.series||"~") || bySeries || sortTitle(a.title).localeCompare(sortTitle(b.title));
  }

  // Each view leaves out what its heading already says.
  function rowMeta(b){
    const meta = [];
    const no = b.seriesNo ? `#${esc(b.seriesNo)}` : "";
    const award = /hugo|nebula/i.test(b.notes||"");
    if (groupKey!=="author") meta.push(`<span class="by">${esc(b.author)}</span>`);
    if (b.series && !(groupKey==="author" && b.series===setOf(b))) meta.push(`<span class="series">${esc(b.series)}${no?" "+no:""}</span>`);
    if (award) meta.push(`<span class="award">${esc((b.notes.match(/(Hugo(?: and | & )?Nebula|Hugo|Nebula)[^.;]*/i)||[""])[0].replace(/ winner.*$/i,""))}</span>`);
    if (groupKey!=="publisher" && b.publisher) meta.push(`<span>${esc(b.publisher)}</span>`);
    if (b.format) meta.push(`<span>${esc(b.format.replace(/ paperback$/i,""))}</span>`);
    if (b.notes && !award) meta.push(`<span>${esc(b.notes)}</span>`);
    return meta.join("");
  }

  function render(){
    const list = $("#list");
    const authors = new Set(books.map(b => (b.author||"").trim()).filter(Boolean));
    const pubs = new Set(books.map(b => b.publisher).filter(Boolean));
    const q = query.trim().toLowerCase();
    const shown = books.filter(b => !q || [b.title,b.author,b.series,b.publisher,b.isbn,b.notes].join(" ").toLowerCase().includes(q)).sort(cmp);
    $("#tally").innerHTML = !books.length ? "No books catalogued yet"
      : q ? `<b>${shown.length}</b> of ${plural(books.length,"book")}`
      : `<b>${books.length}</b> book${books.length===1?"":"s"} · <b>${authors.size}</b> author${authors.size===1?"":"s"} · <b>${pubs.size}</b> imprint${pubs.size===1?"":"s"}`;
    if (!books.length){
      list.innerHTML = `<div class="state"><strong>An empty catalog</strong>No books have been added yet.</div>`;
      return;
    }
    if (!shown.length){ list.innerHTML = `<div class="state"><strong>No matches</strong>Nothing in the catalog matches “${esc(query)}”.</div>`; return; }
    const groups = new Map();
    for (const b of shown){ const g = groupOf(b); if(!groups.has(g)) groups.set(g,[]); groups.get(g).push(b); }
    let keys = [...groups.keys()];
    if (groupKey==="publisher") keys.sort((a,b)=>a.localeCompare(b));
    if (groupKey==="decade") keys.sort();
    list.innerHTML = keys.map(k => {
      const items = groups.get(k);
      const headClass = groupKey==="decade" ? ' class="plain"' : groupKey==="author" ? ' class="author"' : "";
      const showSets = groupKey==="author" && items.some(setOf);
      let prevSet = null;
      return `<section class="group"><div class="ghead"><h2${headClass}>${esc(k)}</h2><span class="count">${items.length}</span></div>` +
        items.map(b => {
          let setHead = "";
          if (showSets && setOf(b)!==prevSet){
            prevSet = setOf(b);
            setHead = `<p class="set"><span>${esc(prevSet||"Other books")}</span><span class="count">${items.filter(x => setOf(x)===prevSet).length}</span></p>`;
          }
          const coverSrc = b.coverFile ? esc(b.coverFile) : b.coverId ? `https://covers.openlibrary.org/b/id/${esc(b.coverId)}-M.jpg` : "";
          const cover = coverSrc
            ? `<img class="cover" src="${coverSrc}" width="88" height="132" loading="lazy" decoding="async" alt="">`
            : `<span class="cover"></span>`;
          return `${setHead}<article class="row">${cover}
            <h3>${groupKey==="author"&&b.readingOrder?`<span class="step">${esc(b.readingOrder)}.</span> `:""}${esc(b.title)}</h3><span class="yr">${esc(b.year||"")}</span>
            <div class="m">${rowMeta(b)}</div>
            ${b.summary?`<details class="more"><summary>Summary</summary><p>${esc(b.summary)}</p></details>`:""}</article>`;
        }).join("") + `</section>`;
    }).join("");
  }

  // The bar is pinned, so without this a change made far down the page would leave the reader mid-list.
  function backToList(){ const top = $("header").offsetTop + $("header").offsetHeight; if (scrollY > top) scrollTo(0, top); }

  function syncSeg(){ document.querySelectorAll(".seg button").forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.k===groupKey))); }
  document.querySelector(".seg").addEventListener("click", e => {
    const k = e.target.closest("button")?.dataset.k; if(!k) return;
    groupKey = k; syncSeg(); try{ localStorage.setItem("ml-group",k); }catch(err){} render(); backToList();
  });
  $("#q").addEventListener("input", e => { query = e.target.value; render(); backToList(); });
  // A cover that fails to load falls back to the same blank block as a book with no cover.
  $("#list").addEventListener("error", e => {
    if (e.target.matches?.("img.cover")){ const blank = document.createElement("span"); blank.className = "cover"; e.target.replaceWith(blank); }
  }, true);

  fetch("books.json")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => { books = data; render(); })
    .catch(() => {
      $("#tally").textContent = "The catalog couldn't be loaded.";
      $("#list").innerHTML = `<div class="state"><strong>Catalog unavailable</strong>Reload the page to try again.</div>`;
    });
})();
</script>
</body>
</html>
